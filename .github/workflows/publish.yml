name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Bump versions
        id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version --prefix packages/core
          npm version "${{ inputs.bump }}" --no-git-tag-version --prefix packages/studio
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: pnpm build

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/package.json packages/studio/package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD --tags

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Using NPM_TOKEN"
          else
            echo "Using trusted publishing (OIDC)"
            unset NODE_AUTH_TOKEN
          fi
          pnpm --filter @git3db/db publish --access public --no-git-checks
          pnpm --filter @git3db/studio publish --access public --no-git-checks

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --title "v${{ steps.version.outputs.version }}" --generate-notes
